<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — calm life OS</title>
<meta name="theme-color" content="#FCFAF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8E4DD;--side:linear-gradient(165deg,#E3ECEC 0%,#F1EEE8 55%,#F4EFE7 100%);--page:#FCFAF6;--paper:#F6F1E8;--card:#FFFFFF;--line:#ECE6DB;--ink:#24211E;--ink2:#6B655C;--ink3:#A49C90;--soft:#F1ECE3;--shadow:0 1px 2px rgba(50,40,30,.05),0 8px 24px rgba(50,40,30,.07);--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--hand:'Caveat',cursive}
body.dark{--bg:#0F0E0D;--side:linear-gradient(165deg,#1B1E1F 0%,#191816 100%);--page:#1C1A18;--paper:#24211E;--card:#262320;--line:#34302B;--ink:#F0EBE3;--ink2:#B8B0A4;--ink3:#7D766B;--soft:#2C2925;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 28px);margin:14px;border-radius:30px;background:var(--side);box-shadow:var(--shadow)}
.side{padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:23px;margin:0 8px 26px}
.orb{width:30px;height:30px;border-radius:10px;background:var(--ink);display:grid;place-items:center;position:relative}
.orb i{width:12px;height:12px;border:1.6px solid var(--page);border-radius:50%}
.orb::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:#E0A27E;top:5px;right:5px}
.mlab{font-size:11.5px;color:var(--ink3);margin:6px 10px 8px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:14px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14px;transition:all .25s;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.45);color:var(--ink)}
body.dark .nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav a .bd{margin-left:auto;background:var(--ink);color:var(--page);font-size:10.5px;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.synccard{margin-top:auto;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.synccard .t{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.synccard .s{font-size:12px;color:var(--ink3);margin:2px 0 10px}
main{background:var(--page);border-radius:24px;margin:10px 10px 10px 0;padding:22px 30px 60px;min-width:0;transition:background .5s}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink3);flex:1}
.crumb b{color:var(--ink);font-weight:500;display:flex;align-items:center;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative;transition:all .2s;color:var(--ink2)}
.ib:hover{color:var(--ink);transform:translateY(-1px)}
.ib .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#E0A27E;border:2px solid var(--card)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:99px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:all .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.pri{background:var(--ink);color:var(--page);border-color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
.view{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-weight:300;font-size:36px;margin:0;letter-spacing:-.015em;line-height:1.1}
h2{font-weight:600;font-size:16px;margin:0}
.muted{color:var(--ink3)}.small{font-size:12.5px}.serif{font-family:var(--serif)}.hand{font-family:var(--hand)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.hrow .sub{color:var(--ink3);font-size:14px;margin-top:4px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:1/-1}
.w{background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);min-width:0;position:relative;transition:transform .25s,box-shadow .25s}
a.w{color:inherit;text-decoration:none;display:block}a.w:hover{transform:translateY(-2px)}
.wt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:8px}
.wt h2{font-size:17px}.wt span{color:var(--ink3);font-size:13px}
.big{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1}
.evrow{display:flex;gap:10px;align-items:center;padding:6px 0}
.evrow .bar{width:4px;align-self:stretch;border-radius:4px}
.evrow .tt{flex:1;min-width:0}.evrow .tt b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evrow .tm{font-size:12px;color:var(--ink3);text-align:right;white-space:nowrap}
.dots{display:grid;grid-template-columns:repeat(13,1fr);gap:7px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--soft)}
.dots i.on{background:var(--ink)}.dots i.cur{background:#E0A27E}
.tg{width:40px;height:23px;border-radius:99px;background:var(--soft);position:relative;border:0;cursor:pointer;flex:none;transition:background .3s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tg.on::after{transform:translateX(17px)}
.hab{display:flex;align-items:center;gap:10px;padding:6px 0}
.hab .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{display:flex;gap:3px}.wk i{width:6px;height:6px;border-radius:50%;background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;border-radius:99px;background:var(--soft);color:var(--ink2);border:0;cursor:pointer;white-space:nowrap;transition:all .2s}
.chip.on{background:var(--ink);color:var(--page)}
.adot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* daily spread */
.spread{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);background:var(--paper);border-radius:28px;box-shadow:var(--shadow);margin:16px 0;position:relative;overflow:hidden}
.leaf{padding:24px 28px 26px}
.leaf.l{background:linear-gradient(to left,rgba(80,60,40,.06),transparent 36px)}
.leaf.r{background:linear-gradient(to right,rgba(80,60,40,.06),transparent 36px)}
.rings{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.rings i{width:40px;height:14px;border:3px solid #A39A8C;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.lhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.lhead .k{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:22px;font-weight:300}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.pri{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card);margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:all .3s}
.pri .n{font-family:var(--serif);font-size:26px;font-weight:300;width:20px;color:var(--ink3);line-height:1}
.pri .tx{flex:1;min-width:0}.pri .tx b{font-weight:500;display:block}
.pri.empty{background:transparent;border:1.5px dashed var(--line);box-shadow:none;cursor:pointer;color:var(--ink3)}
.pri.empty:hover{border-color:var(--ink3)}
.pri.done .tx b{text-decoration:line-through;color:var(--ink3)}
.star{color:#D8A24A;font-size:13px}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid #C9C0B2;background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;transition:all .3s;color:#fff}
.ck.on{background:#8FAE82;border-color:#8FAE82}
.ck.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.3)}}
.hline{width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;font-family:var(--hand);font-size:23px;color:var(--ink);padding:2px 2px 4px;outline:none;transition:border .2s}
.hline:focus{border-color:var(--ink3)}
.hline::placeholder{color:var(--ink3);opacity:.8}
.faces{display:flex;gap:6px}
.face{font-size:24px;width:42px;height:42px;border-radius:50%;border:0;background:transparent;cursor:pointer;filter:grayscale(.8) opacity(.5);transition:all .3s}
.face.on{filter:none;background:var(--card);transform:scale(1.12);box-shadow:var(--shadow)}
.energy{display:flex;gap:6px;flex-wrap:wrap}
.ed{width:17px;height:17px;border-radius:50%;border:0;cursor:pointer;opacity:.22;transition:all .25s}
.ed.on{opacity:1}.ed:hover{transform:scale(1.2)}
.pchk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.pchk .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:99px;cursor:pointer;font-size:12px;color:var(--ink2);transition:all .2s;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.prompt{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.prompt .e{font-size:19px;width:26px;text-align:center}
.rate{display:flex;gap:8px}
.rate button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;transition:all .25s}
.rate button.on{background:#E0A27E;border-color:#E0A27E;color:#fff}
.deep{background:var(--card);border-radius:18px;padding:12px 14px;margin-top:6px}
.deep .q{font-family:var(--serif);font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lined{width:100%;border:0;resize:none;outline:none;background:transparent repeating-linear-gradient(transparent 0 29px,var(--line) 29px 30px);line-height:30px;font-family:var(--hand);font-size:21px;color:var(--ink);min-height:62px;padding:0 2px}
.stamp{position:absolute;right:26px;top:22px;font-family:var(--serif);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8FAE82;border:2px solid #8FAE82;border-radius:12px;padding:4px 10px;transform:rotate(8deg);animation:stamp .5s}
@keyframes stamp{from{transform:rotate(8deg) scale(2);opacity:0}}
/* plan calendar */
.ptools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.planwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}
.calbox{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.cal{display:grid;grid-template-columns:52px repeat(var(--cols),minmax(0,1fr))}
.dh{text-align:center;padding:10px 4px 8px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line)}
.dh b{display:inline-block;margin-left:4px;color:var(--ink);font-weight:500}
.dh.today{background:var(--ink);color:var(--page)}.dh.today b{color:var(--page)}
.due{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:4px;min-height:30px;display:flex;flex-direction:column;gap:3px}
.due span{font-size:10.5px;border-radius:7px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrs{position:relative}
.hrs div{height:44px;font-size:11px;color:var(--ink3);text-align:right;padding-right:8px;transform:translateY(-7px)}
.dcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(var(--card) 0 43px,var(--line) 43px 44px);cursor:copy;transition:background .2s}
.dcol.wknd{background:repeating-linear-gradient(var(--paper) 0 43px,var(--line) 43px 44px)}
.dcol.over{box-shadow:inset 0 0 0 2px #9FB7CF}
.ev{position:absolute;left:4px;right:4px;border-radius:12px;padding:5px 8px;font-size:11.5px;line-height:1.3;cursor:grab;overflow:hidden;transition:transform .2s,box-shadow .2s,opacity .3s;border:1px solid rgba(255,255,255,.4)}
.ev:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08);z-index:3}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2B2724}
.ev span{color:rgba(43,39,36,.62);font-size:10.5px}
.ev.sm{padding:1px 8px;line-height:16px}.ev.sm b{font-size:11px}.ev.done{opacity:.55}.ev.done b{text-decoration:line-through}
.ev .ok{position:absolute;right:6px;top:5px;width:16px;height:16px;border-radius:50%;background:#fff;color:#5F8A55;display:grid;place-items:center;font-size:10px}
.ev.dim{opacity:.18}
.ev.sug{border:1.5px dashed rgba(0,0,0,.25);background:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 6px,transparent 6px 12px)}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--ink);z-index:4}
.now::before{content:attr(data-t);position:absolute;left:-2px;top:-9px;background:var(--ink);color:var(--page);font-size:10px;padding:1px 6px;border-radius:99px;transform:translateX(-100%)}
.tray .w{margin-bottom:14px;padding:16px}
.focus{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;margin-bottom:6px;font-size:13px}
.focus.fe{border:1.5px dashed var(--line);color:var(--ink3);cursor:pointer;justify-content:center}
.titem{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--soft);margin-bottom:6px;cursor:grab;font-size:13px;transition:transform .2s}
.titem:hover{transform:translateX(3px)}
.titem .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem.sug{background:transparent;border:1.5px dashed #B9CBDD}
.cap{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex;margin:8px 0 6px}
.cap i{display:block;height:100%}
.bar2{height:7px;border-radius:99px;background:var(--soft);overflow:hidden}.bar2 i{display:block;height:100%;border-radius:99px;transition:width .8s}
.goal{background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow)}
.ms{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.ms.done span{text-decoration:line-through;color:var(--ink3)}
.ydots{display:grid;grid-template-columns:repeat(26,1fr);gap:8px}
.ydots i{aspect-ratio:1;border-radius:50%;background:var(--soft)}.ydots i.on{background:var(--ink)}.ydots i.cur{background:#E0A27E;box-shadow:0 0 0 4px rgba(224,162,126,.25)}
.vis{border-radius:20px;padding:14px 16px;min-height:108px}
.vis input{width:100%;border:0;background:transparent;font-family:var(--hand);font-size:20px;color:#2B2724;outline:none;margin-top:6px}
/* life */
.wheelBox{touch-action:none;user-select:none;cursor:grab}
.wl{font:12px var(--sans);fill:var(--ink2);cursor:pointer}.wl tspan{fill:var(--ink3)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:18px;padding:12px 12px 10px;cursor:pointer;transition:all .25s;color:#2B2724;border:2px solid transparent}
.tile:hover{transform:translateY(-2px)}.tile.on{border-color:var(--ink)}
.tile .sc{font-size:24px;font-weight:500;line-height:1;margin-top:6px}
.tile .nm{font-size:11.5px;opacity:.7}
/* money */
.jars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.jar{text-align:center;cursor:pointer;transition:transform .3s;border-radius:22px;padding:10px 6px 12px}
.jar:hover{transform:translateY(-4px)}.jar.on{background:var(--soft)}
.jar svg{width:100%;max-width:120px;display:block;margin:0 auto}
.wave{animation:wave 3.2s linear infinite}
@keyframes wave{to{transform:translateX(-50px)}}
.gring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;transition:transform .4s}
.gring>div{width:82px;height:82px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.gring.bump{animation:pop .5s}
.receipt-w{filter:drop-shadow(0 6px 14px rgba(50,40,30,.1))}
.receipt{background:#FFFEFB;color:#2B2724;padding:20px 20px 30px;font:12.5px/1.55 ui-monospace,Menlo,monospace;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.receipt .ln{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed #E6DFD2}
.receipt .ln .c{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.receipt input{font:inherit;border:0;border-bottom:1px solid #E6DFD2;background:transparent;outline:none;padding:4px 2px;color:#2B2724;min-width:0}
/* mind */
.beds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.bed{border-radius:26px;padding:14px 14px 42px;min-height:440px;background:linear-gradient(var(--paper),var(--paper) calc(100% - 26px),#D8C3A2 calc(100% - 26px));transition:box-shadow .2s}
body.dark .bed{background:linear-gradient(var(--paper),var(--paper) calc(100% - 26px),#4A3E30 calc(100% - 26px))}
.bed.over{box-shadow:inset 0 0 0 2px #B3A1BF}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.gcard{border-radius:20px;padding:14px 16px;margin-bottom:12px;cursor:grab;position:relative;color:#2B2724;transition:transform .3s,box-shadow .3s;box-shadow:0 2px 6px rgba(50,40,30,.06)}
.gcard:hover{transform:translateY(-3px) rotate(-.6deg);box-shadow:0 10px 22px rgba(50,40,30,.12)}
.gcard .dt{position:absolute;top:10px;right:14px;text-align:right;line-height:1}
.gcard .dt b{font-size:26px;font-weight:400;display:block}.gcard .dt span{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.gcard .tt{font-size:15.5px;font-weight:600;line-height:1.3;margin:20px 0 6px}
.gcard .ga{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.gcard .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.gcard .acts button{border:0;background:rgba(255,255,255,.7);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;color:#2B2724}
.gcard.due::after{content:'';position:absolute;left:14px;top:-4px;width:10px;height:10px;border-radius:50%;background:#E0A27E;box-shadow:0 0 0 4px rgba(224,162,126,.3)}
.compost{margin-top:14px;border:1.5px dashed var(--line);border-radius:18px;padding:12px;text-align:center;color:var(--ink3);font-size:13px;transition:all .2s}
.compost.over{border-color:#C99B7E;color:#C99B7E}
.note{background:#FFF8D9;color:#2B2724;padding:24px 16px 14px;font-family:var(--hand);font-size:21px;line-height:1.15;position:relative;box-shadow:0 2px 3px rgba(0,0,0,.06),0 10px 18px rgba(50,40,30,.1);transition:transform .3s}
.note::before{content:'';position:absolute;top:8px;left:50%;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E7957A,#B5573E);transform:translateX(-50%);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.note:hover{transform:rotate(0) translateY(-3px)!important}

  if(big){const m=(a0+a1)/2,cs=Math.cos(m*Math.PI/180),[lx,ly]=P(m,R+22);s+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${Math.abs(cs)<.2?'middle':cs>0?'start':'end'}" dominant-baseline="middle" class="wl" ${sel===a.id?'style="font-weight:600;fill:var(--ink)"':''}>${a.id} <tspan>${sc}</tspan></text>`}

 return s+'</svg>';

function calGrid(ds){
 const nowH=new Date().getHours()+new Date().getMinutes()/60;
 let s=`<div class="cal" style="--cols:${ds.length}"><div class="dh" style="border-left:0"></div>`;
 ds.forEach(d=>s+=`<div class="dh ${d===T?'today':''}" ${ds.length>1?`data-act="toDay" data-v="${d}" style="cursor:pointer"`:''}>${wdShort(d)}<b>${dobj(d).getDate()}</b></div>`);
 s+=`<div class="due" style="border-left:0;font-size:10px;color:var(--ink3);justify-content:center;text-align:right;padding-right:8px">due</div>`;
 ds.forEach(d=>{const t=S.tasks.filter(x=>!x.done&&x.due===d);s+=`<div class="due">${t.map(x=>`<span style="background:${tint(ac(x.area),.3)}">${esc(x.title)}</span>`).join('')}</div>`});
 s+=`<div class="hrs">${Array.from({length:END-START},(_,i)=>`<div>${i?fmtT(START+i):''}</div>`).join('')}</div>`;
 ds.forEach(d=>{const wk=[0,6].includes(dobj(d).getDay());
  s+=`<div class="dcol ${wk?'wknd':''}" data-drop="cal" data-date="${d}" data-act="slot" style="height:${(END-START)*HP}px">`;
  evOn(d).forEach(e=>{const ht=Math.max(16,(e.end-e.start)*HP-3),c=ac(e.area),dim=UI.calF!=='All'&&e.area!==UI.calF;
   s+=`<div class="ev ${ht<30?'sm':''} ${e.done?'done':''} ${dim?'dim':''}" draggable="true" data-drag="event:${e.id}" data-act="openEv" data-id="${e.id}" style="top:${(e.start-START)*HP+1}px;height:${ht}px;background:${tint(c,.38)};border-left:3px solid ${c}"><b>${e.goal?'★ ':''}${esc(e.title)}</b>${ht>30?`<span>${fmtT(e.start)} – ${fmtT(e.end)}</span>`:''}${e.done?`<i class="ok">✓</i>`:''}</div>`});
  if(d===T&&nowH>=START&&nowH<=END)s+=`<div class="now" style="top:${(nowH-START)*HP}px" data-t="${fmtT(nowH)}"></div>`;
  s+='</div>'});
 return s+'</div>';
}

/* ============ SYNC parse / apply / brief ============ */
function parseSync(text){
 const out={date:null,items:[],errors:[]};if(!/===\s*ORBIT SYNC/i.test(text))out.errors.push('Missing the "=== ORBIT SYNC" header. Orbit read what it could.');
 let sec=null;const strip=(s,k)=>String(s||'').replace(new RegExp('^'+k+'\\s*:\\s*','i'),'').trim();const isD=s=>/^\d{4}-\d\d-\d\d$/.test(s);
 const push=it=>{it.id=uid();it.on=true;out.items.push(it)};
 text.split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line||/^===/.test(line))return;
  const m=line.match(/^\[([A-Za-z]+)\]\s*(.*)$/);if(m){sec=m[1].toUpperCase();if(!m[2])return}
  const body=m?m[2]:line;
  if(!sec){if(/^date\s*:/i.test(body))out.date=strip(body,'date');else if(/mood\s*:/i.test(body)){const g=k=>{const r=body.match(new RegExp(k+'\\s*:\\s*(\\d+)','i'));return r?+r[1]:null};push({kind:'mood',mood:g('mood'),energy:g('energy'),focus:g('focus')})}return}
  if(!body.startsWith('-'))return;const f=body.replace(/^-\s*/,'').split('|').map(s=>s.trim());
  switch(sec){
   case'PRIORITIES':push({kind:'priority',title:f[0],state:/done/i.test(f[1])?'done':/drop|let/i.test(f[1])?'dropped':'moved'});break;
   case'REFLECTION':{const k=String(f[0]).toLowerCase();if(['win','drain','lesson','rating'].includes(k))push({kind:'reflection',key:k,text:f.slice(1).join(' | ')});break}
   case'GRATITUDE':push({kind:'gratitude',text:f.join(' | ')});break;
   case'MONEY':if(/^income$/i.test(f[0]))push({kind:'income',amount:num(f[1]),category:f[3]||'Income',note:f[4]||''});else push({kind:'expense',amount:num(f[1]),category:f[3]||'Expense',bucket:BUCKETS.find(b=>b.toLowerCase()===String(f[4]).toLowerCase())||'Wants',note:f[5]||''});break;
   case'TASKS':{const d=strip(f[3],'due');push({kind:'task',title:f[0],area:normArea(f[1]),priority:normP(f[2]),due:isD(d)?d:''});break}
   case'HABITS':push({kind:'habit',name:f[0],done:/done|yes|✓/i.test(f[1]||'')});break;
   case'PLAN':{const tm=String(f[3]||'09:00').split(':');push({kind:'plan',title:f[0],area:normArea(f[1]),date:isD(f[2])?f[2]:addDays(1),start:(+tm[0]||9)+(+tm[1]||0)/60,dur:Math.max(.5,num(f[4])/60||1)});break}
   case'THOUGHTS':{const r=strip(f[4],'revisit');push({kind:'thought',topic:f[0],area:normArea(f[1]),stage:STAGES.includes(String(f[2]).toLowerCase())?String(f[2]).toLowerCase():'seed',priority:normP(f[3]),revisit:isD(r)?r:addDays(7),summary:f.slice(5).join(' | ')});break}
   case'INSIGHTS':push({kind:'insight',text:f.join(' | ')});break;
   case'RECALIBRATE':push({kind:'recal',area:normArea(f[0]),what:f[1]||'',why:f.slice(2).join(' | ')});break;
  }});
 if(!out.items.length)out.errors.push('No items found. Check sections like [PLAN] and lines starting with "-".');
 return out;
}
function guessArea(c,b){c=c.toLowerCase();if(/sketch|pen|camera|art|paint/.test(c))return'Creativity';if(/grocer|gym|doctor|fruit|veg/.test(c))return'Health';if(/friend|coffee|dinner|dilan/.test(c))return'Friends';if(/rent|electric|water|fuel/.test(c))return'Environment';if(/book|course/.test(c))return'Self-Growth';return b==='Growth'?'Self-Growth':b==='Wants'?'Recreation':'Money'}
function applySync(p){
 const d=/^\d{4}-\d\d-\d\d$/.test(p.date||'')?p.date:T,D=day(d),c={};
 p.items.filter(i=>i.on).forEach(i=>{c[i.kind]=(c[i.kind]||0)+1;switch(i.kind){
  case'mood':if(i.mood)D.mood=i.mood;if(i.energy)D.energy=i.energy;break;
  case'priority':{let s=D.pri.findIndex(x=>x&&x.title.toLowerCase()===i.title.toLowerCase());if(s<0){s=D.pri.findIndex(x=>!x);if(s<0)break;D.pri[s]={title:i.title,area:'Self-Growth',state:'open'}}D.pri[s].state=i.state;if(i.state==='moved'){const n=day(addDays(1,d));const e=n.pri.findIndex(x=>!x);if(e>=0)n.pri[e]={...D.pri[s],state:'open'}}break}
  case'reflection':if(i.key==='rating')D.rating=Math.min(5,num(i.text)||0);else D[i.key]=i.text;break;
  case'gratitude':D.grat=i.text;break;
  case'expense':S.money.tx.unshift({id:uid(),type:'expense',amount:i.amount,category:i.category,bucket:i.bucket,area:guessArea(i.category,i.bucket),date:d});break;
  case'income':S.money.tx.unshift({id:uid(),type:'income',amount:i.amount,category:i.category,bucket:'',area:'Money',date:d});break;
  case'task':S.tasks.push({id:uid(),title:i.title,area:i.area,priority:i.priority,due:i.due,done:false});break;
  case'habit':{let h=S.habits.find(x=>x.name.toLowerCase()===i.name.toLowerCase());if(!h){h={id:uid(),name:i.name,area:'Self-Growth',week:[0,0,0,0,0,0,0]};S.habits.push(h)}if(d===T)h.week[6]=i.done?1:0;break}
  case'plan':S.suggest.push({id:uid(),title:i.title,area:i.area,date:i.date,start:i.start,dur:i.dur});break;
  case'thought':S.thoughts.unshift({id:uid(),topic:i.topic,area:i.area,stage:i.stage,priority:i.priority,revisit:i.revisit,summary:i.summary});break;
  case'insight':S.insights.unshift({date:d,text:i.text});break;
  case'recal':S.inbox.unshift({id:uid(),text:i.what+' ('+i.area+')',src:'sync'});break;
 }});
 S.lastSync=d;save();return c;
}
function brief(){
 const ms=moneyStats(),{tot,by}=hrsWeek(),ph=priHit(),L=[];
 L.push('=== ORBIT BRIEF ===','date: '+T,'','wheel: '+AREAS.map(a=>a.id+' '+S.scores[a.id]).join(', '),'lowest: '+lowest(3).map(l=>l.id+' '+l.s).join(', '),'');
 L.push('quarter goals:');S.goals.forEach(g=>L.push('- '+g.title+' ('+g.area+'): '+Math.round(gProg(g)*100)+'%, next: '+((g.ms.find(m=>!m.d)||{}).t||'done')));
 L.push('week focus: '+S.focus.filter(Boolean).map(f=>f.text).join('; ')||'none','');
 L.push('calendar this week: '+Math.round(tot)+'h planned · '+Object.entries(by).map(([a,h])=>a+' '+h+'h').join(', '));
 L.push('priorities done (7 days): '+ph.d+'/'+ph.t+' ('+ph.pct+'%)');
 L.push('habits (7 days): '+S.habits.map(h=>h.name+' '+h.week.reduce((a,v)=>a+v,0)+'/7').join(', '),'');
 L.push('reflections:');for(let i=-6;i<=0;i++){const x=S.daily[addDays(i)];if(x&&(x.win||x.drain||x.lesson))L.push('- '+wdShort(addDays(i))+': rating '+(x.rating||'–')+(x.win?' · win: '+x.win:'')+(x.drain?' · drain: '+x.drain:'')+(x.lesson?' · lesson: '+x.lesson:''))}
 L.push('','money this month: income '+money(ms.income)+', out '+money(ms.out)+', saving '+Math.round(ms.rate)+'%');
 BUCKETS.forEach(b=>L.push('- '+b+': '+(ms.plan[b]?Math.round(ms.spent[b]/ms.plan[b]*100):0)+'% of plan'));
 L.push('','ideas due: '+S.thoughts.filter(t=>t.stage!=='archived'&&t.revisit<=addDays(3)).map(t=>t.topic).join('; '));
 L.push('','Help me: spot patterns, tell me what to refocus on, and propose time blocks for next week as [PLAN].','=== END ===');
 return L.join('\n');
}

 if(c.contains('custompri')&&d.t.trim()){day(T).pri[UI.mdata.i]={title:d.t.trim(),area:'Self-Growth',state:'open'};closeModal();soft()}
 if(c.contains('newgoal')){S.goals.push({id:'g'+uid(),title:d.t.trim(),area:d.a,ms:(d.m||'').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t,d:0}))});closeModal();soft();toast('Goal created')}
 if(c.contains('addms')&&d.t.trim()){goalOf(f.dataset.g).ms.push({t:d.t.trim(),d:0});soft()}
 if(c.contains('addhab')){S.habits.push({id:uid(),name:d.n.trim(),area:d.a,week:[0,0,0,0,0,0,0]});soft();toast('Habit added')}
 if(c.contains('setmoney')){S.money.income=num(d.inc);BUCKETS.forEach(b=>S.money.buckets[b]=num(d[b]));closeModal();soft();toast('Money settings saved')}
 if(c.contains('addnw')){const v=num(d.v),k=TODAY.toLocaleDateString('en-GB',{month:'short'}),nw=S.money.netWorth;if(nw.length&&nw[nw.length-1][0]===k)nw[nw.length-1][1]=v;else nw.push([k,v]);S.money.netWorth=nw.slice(-12);soft();toast('Net worth updated')}
 if(c.contains('addmg')){S.money.goals.push({id:'m'+uid(),name:d.n.trim(),target:num(d.t),saved:0,deadline:d.d,area:'Money'});soft();toast('Money goal added')}
 if(c.contains('addtx')){const a=num(d.amt);if(!a)return;const inc=UI.addType==='income';S.money.tx.unshift({id:uid(),type:inc?'income':'expense',amount:a,category:d.cat.trim(),bucket:inc?'':UI.addB,area:inc?'Money':guessArea(d.cat,UI.addB),date:T});soft();toast('Logged')}
 if(c.contains('addthought')){S.thoughts.unshift({id:uid(),topic:d.t.trim(),area:d.a,stage:'seed',priority:'P2',revisit:addDays(7),summary:''});soft();toast('Planted 🌱')}
 if(c.contains('addnote')){S.notes.push({id:uid(),title:d.t.trim(),text:d.x||'',c:['#FFF8D9','#FBE3D6','#E2EEDC','#E6EEF6'][S.notes.length%4]});soft()}
});
/* drag & drop */
let dragId=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(!el)return;dragId=el.dataset.drag;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';setTimeout(()=>el.style.opacity=.4,0)});
document.addEventListener('dragend',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(el)el.style.opacity='';document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(!z||!dragId)return;const t=dragId.split(':')[0];if((z.dataset.drop==='cal')!==(t!=='thought'))return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z||!dragId)return;e.preventDefault();const [t,id]=dragId.split(':');dragId=null;
 if(z.dataset.drop==='stage'&&t==='thought'){const th=findTh(id);th.stage=z.dataset.v;if(z.dataset.v!=='archived')th.revisit=addDays(7);soft();toast(z.dataset.v==='archived'?'Let go 🍂':'Moved to '+STN[z.dataset.v]);return}
 if(z.dataset.drop!=='cal')return;const date=z.dataset.date,st=hourAt(z,e.clientY);
 if(t==='event'){const ev=S.events.find(x=>x.id===id),len=ev.end-ev.start;ev.date=date;ev.start=st;ev.end=Math.min(END,st+len)}
 if(t==='task'){const k=S.tasks.find(x=>x.id===id);S.events.push({id:uid(),date,start:st,end:st+1,title:k.title,area:k.area,goal:k.goal||null,done:false})}
 if(t==='sug'){const s=S.suggest.find(x=>x.id===id);S.events.push({id:uid(),date,start:st,end:Math.min(END,st+s.dur),title:s.title,area:s.area,goal:null,done:false});S.suggest=S.suggest.filter(x=>x.id!==id)}
 soft();toast('Planned for '+fmtDate(date)+' at '+fmtT(st))});
/* wheel drag */
let wDrag=false;
function wheelAt(e,down){const box=document.getElementById('wheelBox');if(!box)return false;const sv=box.querySelector('svg'),r=sv.getBoundingClientRect(),W=600,s=r.width/W,x=(e.clientX-r.left)/s,y=(e.clientY-r.top)/s,cx=300,cy=250,R=170,r0=R*.14,dist=Math.hypot(x-cx,y-cy);
 let ang=Math.atan2(y-cy,x-cx)*180/Math.PI+90;if(ang<0)ang+=360;const id=AREAS[Math.floor(ang/30)%12].id;
 if(down&&dist>R+60)return false;UI.sel=id;if(dist<=R+8&&dist>=r0*.6)S.scores[id]=Math.max(1,Math.min(10,Math.round((dist-r0)/(R-r0)*10)));else if(down){updWheel();return false}
 updWheel();return true}
function updWheel(){const b=document.getElementById('wheelBox');if(b)b.innerHTML=wheelSVG(true,UI.sel);const s=document.getElementById('lifeSide');if(s)s.innerHTML=lifeSide(UI.sel)}
document.addEventListener('pointerdown',e=>{const box=e.target.closest('#wheelBox');if(!box)return;if(wheelAt(e,true)){wDrag=true;try{box.setPointerCapture(e.pointerId)}catch(_){}}});
document.addEventListener('pointermove',e=>{if(wDrag)wheelAt(e)});
document.addEventListener('pointerup',()=>{if(wDrag){wDrag=false;save()}});
render();
if(FIRST){openModal('welcome')}
</script>
